# Полный стенд локально: магазин + Prometheus + Grafana.
#   docker compose up -d --build
#   магазин    http://localhost:3000
#   prometheus http://localhost:9090
#   grafana    http://localhost:3001  (дашборд открыт без логина; admin / $GRAFANA_ADMIN_PASSWORD)
services:
  shop:
    build: ./app
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      PORT: 3000
    volumes:
      - shop-data:/data

  prometheus:
    build: ./monitoring/prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    environment:
      SHOP_TARGET: shop:3000
      ENV_NAME: local
    volumes:
      - prometheus-data:/prometheus
    depends_on: [shop]

  grafana:
    build: ./monitoring/grafana
    restart: unless-stopped
    ports: ["3001:3000"]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    depends_on: [prometheus]

volumes:
  shop-data:
  prometheus-data:
